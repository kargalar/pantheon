name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test ./Pantheon.slnx -c Release --nologo
      - name: Publish Windows x64
        run: dotnet publish ./src/VideoPlayer/VideoPlayer.csproj -c Release -r win-x64 --self-contained true -o ./artifacts/ci/Pantheon --nologo
